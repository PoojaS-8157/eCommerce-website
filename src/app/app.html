<div class="app-shell">
  <nav class="top-navbar">
    <div class="container navbar-inner">
      <a class="brand" routerLink="/home" aria-label="Go to home page">
        <span class="brand-mark">N</span>
        <span>Northstar</span>
      </a>

      <div class="nav-menu" aria-label="Main navigation">
        <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
        <a class="nav-link" routerLink="/checkout" routerLinkActive="active" >Checkout</a>
        <a class="nav-link" routerLink="/my-orders" routerLinkActive="active">My Orders</a>
      </div>

      <div class="nav-actions">
        <button class="icon-button" type="button" aria-label="Search">
          <span>⌕</span>
        </button>

        <button class="cart-button" type="button" aria-label="Shopping cart" (click)="toggleCart()">
          <span>Cart</span>
          <span class="cart-badge">{{ totalItems$ | async }}</span>
        </button>

        <ng-container *ngIf="loggedInUser; else loggedOut">
          <div class="user-menu">
            <button class="user-trigger" aria-haspopup="true" aria-expanded="false">
              <div class="user-avatar" aria-hidden="true">{{ loggedInUser?.name?.charAt(0) }}</div>
              <span class="user-greet">Hi, {{ loggedInUser?.name }}</span>
              <span class="chev">▾</span>
            </button>

            <div class="user-dropdown" role="menu">
              <div class="dropdown-item user-fullname">{{ loggedInUser.name }}</div>
              <button type="button" class="dropdown-item logout-button" (click)="logout()">Log out</button>
            </div>
          </div>
        </ng-container>

        <ng-template #loggedOut>
          <a class="login-button" routerLink="/login">Login</a>
        </ng-template>
      </div>
    </div>
  </nav>

  <div class="cart-overlay" *ngIf="isCartOpen" (click)="closeCart()">
    <aside class="cart-drawer" role="dialog" aria-modal="true" aria-label="Shopping cart" (click)="$event.stopPropagation()">
      <div class="cart-header">
        <div>
          <span class="eyebrow">Your bag</span>
          <h2>Shopping Cart</h2>
        </div>
        <button class="close-cart" type="button" aria-label="Close cart" (click)="closeCart()">✕</button>
      </div>

    <div class="cart-body" *ngIf="cartList().length; else emptyCart">
        <article class="cart-item" *ngFor="let item of cartList()">
          <img *ngIf="item.productImageUrl && item.productImageUrl.startsWith('http')" class="cart-image" [src]="item.productImageUrl" [alt]="item.productName" />
          <div *ngIf="!item.productImageUrl || !item.productImageUrl.startsWith('http')" class="cart-image" [ngClass]="item.productImageUrl"></div>
          <div class="cart-item-info">
            <h3>{{ item.productName }}</h3>
            <p>₹{{ item.productPrice }}</p>
            <div class="quantity-row">
              <button type="button" (click)="decreaseQuantity(item.productId)">-</button>
              <span>{{ item.quantity }}</span>
              <button type="button" (click)="increaseQuantity(item.productId)">+</button>
            </div>
          </div>
          <button class="remove-item" type="button" (click)="removeItem(item.productId)">Remove</button>
        </article>
      </div>

      <ng-template #emptyCart>
        <div class="empty-cart">
          <p>Your cart is empty.</p>
          <button type="button" class="primary-cart-action" routerLink="/products" (click)="closeCart()">Browse Products</button>
        </div>
      </ng-template>

      <div class="cart-footer" *ngIf="cartItems.length">
        <div class="summary-row">
          <span>Subtotal</span>
          <strong>₹{{ subtotal }}</strong>
        </div>
        <button type="button" class="primary-cart-action" (click)="navigateToCheckout()">Proceed to Checkout</button>
      </div>
    </aside>
  </div>
@if (userService.loading$ | async) {
  <div class="global-loader" aria-live="polite" aria-busy="true" role="status">
    <div class="loader-backdrop"></div>
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <span class="loader-text">Loading...</span>
    </div>
  </div>
}
  <app-global-dialog />
  <main class="page-shell">
    <router-outlet />
  </main>
</div>

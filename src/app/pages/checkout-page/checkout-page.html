<section class="checkout-page">
  <div class="container checkout-layout">
    <div class="checkout-main">
      <div class="section-card shipping-card">
        <div class="section-header">
          <h2>Shipping Address</h2>
        </div>

        <div class="form-grid">
          <div class="field-group full-width">
            <label>Full Name</label>
            <input type="text" placeholder="John Carter" />
          </div>

          <div class="field-group full-width">
            <label>Address</label>
            <input type="text" placeholder="123 Market Street" />
          </div>

          <div class="field-group">
            <label>City</label>
            <input type="text" placeholder="New York" />
          </div>

          <div class="field-group">
            <label>Zip</label>
            <input type="text" placeholder="10001" />
          </div>

          <div class="field-group full-width">
            <label>Phone</label>
            <input type="tel" placeholder="+1 555 123 4567" />
          </div>
        </div>
      </div>

      <div class="section-card payment-card">
        <div class="section-header">
          <h2>Payment Method</h2>
        </div>

        <div class="payment-options">
          <label class="payment-option selected">
            <input type="radio" name="payment" checked />
            <span>Credit Card</span>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" />
            <span>UPI</span>
          </label>

          <label class="payment-option">
            <input type="radio" name="payment" />
            <span>PayPal</span>
          </label>
        </div>
      </div>
    </div>

    <aside class="order-summary">
      <div class="summary-card">
        <div class="section-header">
          <h2>Order Summary</h2>
        </div>

        <div class="item-list">
          <div class="order-item">
            <div class="thumb thumb-one"></div>
            <div class="item-info">
              <h3>Urban Audio Max</h3>
              <p>Qty: 1</p>
            </div>
            <strong>$129</strong>
          </div>

          <div class="order-item">
            <div class="thumb thumb-two"></div>
            <div class="item-info">
              <h3>Minimal Desk Lamp</h3>
              <p>Qty: 1</p>
            </div>
            <strong>$79</strong>
          </div>
        </div>

        <div class="totals">
          <div class="total-row">
            <span>Subtotal</span>
            <span>$208</span>
          </div>

          <div class="total-row">
            <span>Shipping</span>
            <span>$18</span>
          </div>

          <div class="promo-row">
            <label>Promo Code</label>
            <div class="promo-input-wrap">
              <input type="text" placeholder="Enter promo code" />
              <button type="button">Apply</button>
            </div>
          </div>

          <div class="total-row grand-total">
            <span>Total</span>
            <span>$226</span>
          </div>
        </div>

        <button type="button" class="place-order-btn">Place Order</button>
      </div>
    </aside>
  </div>
</section>
